# dockshim configuration.
# Values support environment interpolation: $VAR, ${VAR}, ${VAR:-default}, ${VAR:?error}, $$ for a literal $.

# Where `dockshim install` creates the alias entry points, relative to the project root.
# bin_dir: .dockshim/bin

# Options passed to every docker compose call.
# compose:
#   files: [compose.yaml]
#   project_name: my-project

global:
  # host (uid:gid running dockshim), uid[:gid] or name[:group].
  user: host
  env:
    # Appended to the built-in denylist (PATH, HOME, USER, DOCKER_*, SSH_*, XDG_*...).
    deny: []
    deny_prefixes: []
    # Always forwarded, even if denied.
    allow: []
    # Set in the container.
    vars: {}
  # Host paths in arguments: mapped ones are rewritten, copyable files copied to /tmp in the container.
  path_translation:
    enabled: true
    # Directories whose files may be copied. System temporary directories always may.
    # Any other path keeps its value, and so designates the container's own file.
    allow: []
    # Let a symlink in an allowed directory point out of it.
    follow_symlinks: false
    max_copy_mb: 100

# Each alias runs the command of the same name in its target.
aliases:
  # php:
  #   service: app              # compose service
  #   # Inferred from the container's bind mounts inside the project when omitted.
  #   path_mapping:
  #     .: /app                 # host path (relative to the project root): container path
  #   user: 1000                # overrides global.user
  #   env:
  #     vars:
  #       APP_ENV: dev          # merged over global.env.vars
