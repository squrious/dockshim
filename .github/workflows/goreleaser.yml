name: GoReleaser

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Smoke-tests install.sh as published, against the new release.
  install:
    needs: goreleaser
    uses: ./.github/workflows/install.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
